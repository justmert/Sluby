upstream aggregator_backend {
    server backend:3000;
    keepalive 32;
}

# Cache zone configuration
# 100m keys_zone holds ~800k cache keys in shared memory
# 10g max_size for cached response bodies on disk
# 24h inactive evicts entries not accessed within 24 hours
proxy_cache_path /var/cache/nginx/sia levels=1:2 keys_zone=sia_cache:100m
    max_size=10g inactive=24h use_temp_path=off;

server {
    listen 80;
    server_name _;

    # Global CORS headers for HLS cross-origin playback
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

    # Handle preflight OPTIONS requests globally
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Object/segment serving with aggressive caching (immutable content)
    location /v1/objects/ {
        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Caching configuration.
        #
        # Only whole-object responses (200) are cached: manifests, thumbnails,
        # and small full files. Range requests are the single-file HLS segment
        # reads, where many segments share ONE object URI and differ only by
        # the byte range. Caching a 206 under a range-independent key would
        # return the wrong bytes for a different range, so ranged requests
        # bypass the cache entirely and stream straight from the backend, which
        # fetches only the requested Sia slabs (its own range-passthrough
        # design). The key includes the query string so signed / typed variants
        # never collide, and a private `Cache-Control: no-store` response is
        # never stored.
        proxy_cache sia_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_key $scheme$proxy_host$uri$is_args$args;
        proxy_cache_bypass $http_range;
        proxy_no_cache $http_range;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # Pass range requests through for seeking within segments.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;

        # Cache status header for debugging. The aggregator sets its own
        # X-Cache-Status for its in-memory LRU, so drop the upstream value
        # first. Otherwise the client receives two conflicting headers.
        proxy_hide_header X-Cache-Status;
        add_header X-Cache-Status $upstream_cache_status always;

        # Re-add CORS headers since add_header in location overrides server-level
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    }

    # Manifest serving with short cache TTL (manifests may be updated)
    location /v1/stream/ {
        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Caching configuration - short TTL for manifest freshness. The key
        # includes the query string so a signed (private) manifest request is
        # never confused with an unsigned one; those responses are also
        # `Cache-Control: no-store`, so nginx does not cache them at all.
        proxy_cache sia_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_key $scheme$proxy_host$uri$is_args$args;
        proxy_cache_use_stale error timeout http_500 http_502 http_503;
        proxy_cache_lock on;

        # Cache status header for debugging. The aggregator sets its own
        # X-Cache-Status for its in-memory LRU, so drop the upstream value
        # first. Otherwise the client receives two conflicting headers.
        proxy_hide_header X-Cache-Status;
        add_header X-Cache-Status $upstream_cache_status always;

        # Re-add CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    }

    # API passthrough - no caching, direct proxy to backend
    location /api/ {
        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No caching for API requests
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # Support large upload metadata
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # No caching for health checks
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
