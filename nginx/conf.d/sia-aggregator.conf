# keep the scheme an outer proxy (caddy terminating tls) saw, so the backend
# builds https urls for tus uploads and oauth; fall back to our own scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# the address is re-resolved while running (resolver in limits.conf, rendered
# from nginx/templates), so a recreated backend container is followed
upstream aggregator_backend {
    zone aggregator_backend 64k;
    server backend:3000 resolve;
    keepalive 32;
}

# Cache zone configuration
# 100m keys_zone holds ~800k cache keys in shared memory
# 10g max_size for cached response bodies on disk
# 24h inactive evicts entries not accessed within 24 hours
proxy_cache_path /var/cache/nginx/sia levels=1:2 keys_zone=sia_cache:100m
    max_size=10g inactive=24h use_temp_path=off;

server {
    listen 80;
    server_name _;

    # redirects carry only the path, so the browser keeps the scheme, host
    # and port it used (a published port such as 8080, or https at caddy)
    absolute_redirect off;

    # the studio build (baked into the web image) and its routes under
    # /studio; the api and delivery routes below are proxied
    root /usr/share/nginx/html;

    # on every response except the delivery locations below, which set their
    # own headers and so inherit none of these: players fetch those across
    # origins, and nosniff would get some of their no-cors media loads
    # blocked
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # requests over a per-client limit (limits.conf)
    error_page 429 @too_many_requests;

    location @too_many_requests {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Access-Control-Allow-Origin * always;
        return 429 '{"error":"Too many requests"}\n';
    }

    location = / {
        return 302 /studio;
    }

    # hashed build assets never change under the same name
    location /assets/ {
        add_header_inherit merge;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # the single-page app answers every studio route, but a path with a file
    # extension is a file, so a missing chunk is a 404 rather than the app
    location = /studio {
        try_files $uri /index.html;
    }

    location /studio/ {
        location ~ \.[A-Za-z0-9]+$ {
            try_files $uri =404;
        }
        try_files $uri /index.html;
    }

    # the studio page. The script hash is the inline theme script in
    # frontend/index.html (a test checks they match); the sia sdk is
    # webassembly, hls.js and the player use blob: media and workers, and
    # direct-from-sia playback reaches the indexer and the hosts over https
    # and webtransport, wherever the share map points.
    location = /index.html {
        add_header_inherit merge;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Oa+LU1Wm59OgkHGn7EA0f9hzazA0n1MOaM3OwrvOMGY=' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # the few files at the root of the build (favicon); nothing else lives
    # here, so an unknown path is a 404
    location / {
        add_header_inherit merge;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Object/segment serving with aggressive caching (immutable content)
    location /v1/objects/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Caching configuration.
        #
        # Only whole-object responses (200) are cached: manifests, thumbnails,
        # and small full files. Range requests are the single-file HLS segment
        # reads, where many segments share ONE object URI and differ only by
        # the byte range. Caching a 206 under a range-independent key would
        # return the wrong bytes for a different range, so ranged requests
        # bypass the cache entirely and stream straight from the backend, which
        # fetches only the requested Sia slabs (its own range-passthrough
        # design). The key includes the query string so signed / typed variants
        # never collide, and a private `Cache-Control: no-store` response is
        # never stored.
        proxy_cache sia_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_key $scheme$proxy_host$uri$is_args$args;
        proxy_cache_bypass $http_range;
        proxy_no_cache $http_range;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # Pass range requests through for seeking within segments.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;

        # Cache status header for debugging. The aggregator sets its own
        # X-Cache-Status for its in-memory LRU, so drop the upstream value
        # first. Otherwise the client receives two conflicting headers.
        proxy_hide_header X-Cache-Status;
        add_header X-Cache-Status $upstream_cache_status always;

        # cors for players embedded on other origins. The backend sends its own
        # cors headers on delivery responses too, so drop those first: a second
        # Access-Control-Allow-Origin makes browsers reject the response.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    }

    # Manifest serving with short cache TTL (manifests may be updated)
    location /v1/stream/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Caching configuration - short TTL for manifest freshness. The key
        # includes the query string so a signed (private) manifest request is
        # never confused with an unsigned one; those responses are also
        # `Cache-Control: no-store`, so nginx does not cache them at all.
        proxy_cache sia_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_key $scheme$proxy_host$uri$is_args$args;
        proxy_cache_use_stale error timeout http_500 http_502 http_503;
        proxy_cache_lock on;

        # Cache status header for debugging. The aggregator sets its own
        # X-Cache-Status for its in-memory LRU, so drop the upstream value
        # first. Otherwise the client receives two conflicting headers.
        proxy_hide_header X-Cache-Status;
        add_header X-Cache-Status $upstream_cache_status always;

        # cors for players embedded on other origins. The backend sends its own
        # cors headers on delivery responses too, so drop those first: a second
        # Access-Control-Allow-Origin makes browsers reject the response.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    }

    # Public sia:// share maps for direct-from-Sia playback. The backend marks
    # a gated map `private, no-store` and a public one cacheable for at most a
    # minute (always well inside the shares' lifetime), and nginx follows that
    # Cache-Control, so only public maps are ever stored here.
    location /v1/share/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_cache sia_cache;
        proxy_cache_key $scheme$proxy_host$uri$is_args$args;
        proxy_cache_lock on;

        proxy_hide_header X-Cache-Status;
        add_header X-Cache-Status $upstream_cache_status always;

        # same cors handling as /v1/stream: drop the backend's headers so the
        # browser sees exactly one Access-Control-Allow-Origin
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    }

    # the rest of the gateway (such as /v1/cache/stats), uncached; an unknown
    # /v1/ path gets the backend's json 404 rather than the studio
    location /v1/ {
        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # the server-level headers are the only copy
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # API passthrough - no caching, direct proxy to backend
    location /api/ {
        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        # the client realip resolved above, alone: the backend then needs to
        # trust only this hop, and a client cannot slip in addresses of its own
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # the server-level headers are the only copy
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;

        # No caching for API requests
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # Support large upload metadata
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;

        # No caching for health checks
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
