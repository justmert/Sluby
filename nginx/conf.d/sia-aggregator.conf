# keep the scheme an outer proxy (caddy terminating tls) saw, so the backend
# builds https urls for tus uploads and oauth; fall back to our own scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# the address is re-resolved while running (resolver in limits.conf, rendered
# from nginx/templates), so a recreated backend container is followed
upstream aggregator_backend {
    zone aggregator_backend 64k;
    server backend:3000 resolve;
    keepalive 32;
}

# Cache zone configuration
# 100m keys_zone holds ~800k cache keys in shared memory
# 10g max_size for cached response bodies on disk
# 24h inactive evicts entries not accessed within 24 hours. An entry is only
# fresh for as long as the backend allows (X-Accel-Expires, a minute at most
# for delivery); after that it is revalidated, and the backend re-checks access
# before it answers 304, so a kept body is never served past an access change.
proxy_cache_path /var/cache/nginx/sia levels=1:2 keys_zone=sia_cache:100m
    max_size=10g inactive=24h use_temp_path=off;

server {
    listen 80;
    server_name _;

    # redirects carry only the path, so the browser keeps the scheme, host
    # and port it used (a published port such as 8080, or https at caddy)
    absolute_redirect off;

    # the studio build (baked into the web image) and its routes under
    # /studio; the api and delivery routes below are proxied
    root /usr/share/nginx/html;

    # on every response except the delivery locations below, which set their
    # own headers and so inherit none of these: players fetch those across
    # origins, and nosniff would get some of their no-cors media loads
    # blocked
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # requests over a per-client limit (limits.conf)
    error_page 429 @too_many_requests;

    location @too_many_requests {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Access-Control-Allow-Origin * always;
        return 429 '{"error":"Too many requests. Try again in a few seconds."}\n';
    }

    location = / {
        return 302 /studio;
    }

    # hashed build assets never change under the same name
    location /assets/ {
        add_header_inherit merge;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # the single-page app answers every studio route, but a path with a file
    # extension is a file, so a missing chunk is a 404 rather than the app
    location = /studio {
        try_files $uri /index.html;
    }

    # the watch page's hybrid player keeps one name across builds, so it is
    # checked again on every load; the chunks it loads are hashed assets
    location = /studio/watch-player.js {
        add_header_inherit merge;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /studio/ {
        location ~ \.[A-Za-z0-9]+$ {
            try_files $uri =404;
        }
        try_files $uri /index.html;
    }

    # the studio page. The script hash is the inline theme script in
    # frontend/index.html (a test checks they match); the sia sdk is
    # webassembly, hls.js and the player use blob: media and workers, and
    # direct-from-sia playback reaches the indexer and the hosts over https
    # and webtransport, wherever the share map points.
    location = /index.html {
        add_header_inherit merge;
        # no-store, not no-cache: the page must not be kept in the back/forward
        # cache, or Back after signing out shows the signed-in studio again.
        # the hashed assets it loads keep their long cache.
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-0vPhM+E2VMfHx0by/Hfns8AKUJwQgZH3EHdVYB9fYNU=' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # the few files at the root of the build (favicon). any other path is a
    # 404 that shows the studio's own not-found page, with its csp and a way
    # back, instead of nginx's bare page; a path with a file extension is a
    # missing file and stays a plain 404.
    location / {
        add_header_inherit merge;
        add_header Cache-Control "no-cache";
        location ~ \.[A-Za-z0-9]+$ {
            try_files $uri =404;
        }
        try_files $uri @studio_not_found;
    }

    location @studio_not_found {
        # the status stays 404; the body is the app, served through
        # location = /index.html for its headers
        error_page 404 /index.html;
        return 404;
    }

    # Object/segment serving with aggressive caching (immutable content)
    location /v1/objects/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Caching configuration.
        #
        # Only small public whole objects (manifests, playlists, thumbnails)
        # are kept: the backend marks exactly those with X-Accel-Expires, for a
        # minute. Large objects and ranged media are sent `no-cache` without
        # it, so nginx streams them through and stores nothing; private ones
        # are `no-store`. A kept entry is revalidated once stale, and the
        # backend answers 304 only while the object is still public, so an
        # access change reaches every viewer within that minute. Nothing stale
        # is ever served in place of an answer, not even when the backend is
        # down.
        #
        # The key is the method, the path and the type hint, the only part of
        # the query that changes the answer, so `?x=<random>` cannot force
        # misses. Signed requests skip the cache both ways: they are answered
        # per request.
        proxy_cache sia_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_key $request_method$uri?type=$arg_type;
        proxy_cache_convert_head off;
        proxy_cache_bypass $http_range $arg_sig;
        proxy_no_cache $http_range $arg_sig;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        # what is not kept passes through with only nginx's memory buffers, so
        # a slow client slows the backend's read from Sia instead of filling a
        # temp file
        proxy_max_temp_file_size 0;

        # Pass range requests through for seeking within segments; the backend
        # answers them itself.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Cache status header for debugging. The aggregator sets its own
        # X-Cache-Status for its in-memory LRU, so drop the upstream value
        # first. Otherwise the client receives two conflicting headers.
        proxy_hide_header X-Cache-Status;
        add_header X-Cache-Status $upstream_cache_status always;

        # cors for players embedded on other origins. The backend sends its own
        # cors headers on delivery responses too, so drop those first: a second
        # Access-Control-Allow-Origin makes browsers reject the response.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
    }

    # Master manifests by asset or playback id, kept like public objects
    location /v1/stream/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # The backend marks master playlists so nginx never keeps them: each
        # load is a play it counts. The cache settings stay for responses the
        # backend does allow, and a signed request is never stored.
        proxy_cache sia_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_key $request_method$uri;
        proxy_cache_convert_head off;
        proxy_cache_bypass $arg_sig;
        proxy_no_cache $arg_sig;
        proxy_cache_revalidate on;
        proxy_cache_lock on;

        # Cache status header for debugging. The aggregator sets its own
        # X-Cache-Status for its in-memory LRU, so drop the upstream value
        # first. Otherwise the client receives two conflicting headers.
        proxy_hide_header X-Cache-Status;
        add_header X-Cache-Status $upstream_cache_status always;

        # cors for players embedded on other origins. The backend sends its own
        # cors headers on delivery responses too, so drop those first: a second
        # Access-Control-Allow-Origin makes browsers reject the response.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
    }

    # sia:// share maps for direct-from-Sia playback. The backend marks every
    # map `no-store`: minting one is how a direct-from-Sia play shows up, so
    # each must reach it to be counted. A signed request is never stored either
    # way.
    location /v1/share/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_cache sia_cache;
        proxy_cache_key $request_method$uri?expires_in=$arg_expires_in;
        proxy_cache_bypass $arg_sig;
        proxy_no_cache $arg_sig;
        proxy_cache_revalidate on;
        proxy_cache_lock on;

        proxy_hide_header X-Cache-Status;
        add_header X-Cache-Status $upstream_cache_status always;

        # same cors handling as /v1/stream: drop the backend's headers so the
        # browser sees exactly one Access-Control-Allow-Origin
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
    }

    # the rest of the gateway (such as /v1/cache/stats), uncached; an unknown
    # /v1/ path gets the backend's json 404 rather than the studio
    location /v1/ {
        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # the server-level headers are the only copy
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # API passthrough - no caching, direct proxy to backend
    location /api/ {
        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        # the client realip resolved above, alone: the backend then needs to
        # trust only this hop, and a client cannot slip in addresses of its own
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # the server-level headers are the only copy
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;

        # No caching for API requests
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # Support large upload metadata
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    # the public watch page and its files. other sites frame it, so it skips
    # the server-level X-Frame-Options DENY: setting its own headers here means
    # none of those are inherited, and the backend sends its own CSP with
    # frame-ancestors *, nosniff and referrer policy
    location ^~ /watch/ {
        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header X-Content-Type-Options nosniff always;
        proxy_hide_header X-Content-Type-Options;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;

        # No caching for health checks
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # prometheus metrics for a scraper outside the compose network. The
    # backend knows a request came this way by the X-Forwarded-For set here:
    # without METRICS_TOKEN it answers 404, as for an unknown route, and with
    # it the bearer token is required. A scraper inside the network keeps
    # using backend:3000. It checks a secret, so it shares the sign-in
    # per-client limit (limits.conf).
    location = /metrics {
        proxy_pass http://aggregator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # always set, over whatever the client sent, so no request through
        # here can pass for one made on the internal network
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # the server-level headers are the only copy
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
