worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # urls carry capabilities: the sig of a signed object url, the code and
    # state of the sign-in callback, and invite and reset tokens in the path.
    # the log keeps the path with link tokens redacted and only says whether
    # there was a query, like the backend's own request log. the referer gets
    # the same, since the join and reset pages send theirs to the api.
    map $request_uri $log_request_path {
        "~^(?<path>[^?]*)" $path;
        default "";
    }
    map $log_request_path $log_path {
        "~^(?<head>.*/(?:auth/invites|studio/join|studio/reset)/)[^/]+(?<tail>.*)$" "${head}[redacted]${tail}";
        default $log_request_path;
    }
    map $args $log_query {
        "" "";
        default "?[redacted]";
    }
    map $http_referer $log_referer_path {
        "~^(?<path>[^?#]*)" $path;
        default "";
    }
    map $log_referer_path $log_referer {
        "" "-";
        "~^(?<head>.*/(?:auth/invites|studio/join|studio/reset)/)[^/]+(?<tail>.*)$" "${head}[redacted]${tail}";
        default $log_referer_path;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $log_path$log_query $server_protocol" '
                    '$status $body_bytes_sent "$log_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;
    # the error log cannot be formatted and repeats the raw request line, so
    # keep missing files (a token page that is not a file, say) out of it
    log_not_found off;

    # no version in the Server header or on error pages
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 0;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/vnd.apple.mpegurl application/json application/javascript
               text/javascript text/css image/svg+xml application/wasm;

    # the client address. A connection from a private or loopback address is
    # another proxy (caddy in production, or one the operator runs in front),
    # so the client is the last untrusted address in its X-Forwarded-For. The
    # per-client limits and the address passed to the backend use the result.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 169.254.0.0/16;
    set_real_ip_from ::1;
    set_real_ip_from fc00::/7;
    set_real_ip_from fe80::/10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
