services:
  backend:
    build: ./backend
    container_name: sluby-backend
    ports:
      - '4500:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://sluby:sluby@postgres:5432/sluby
      - REDIS_URL=redis://redis:6379
      # indexd is brought up by docker-compose.sia.yml. Both files live in the
      # same directory, so both compose projects share the same default
      # network and the container hostname `sia-indexd` resolves from here.
      # 9982 is the application API the backend SDK talks to. 9980 is the
      # password-protected admin API (wallet address, contract list).
      # `localhost` would resolve to the backend container itself, not indexd.
      - SIA_INDEXER_URL=${SIA_INDEXER_URL:-http://sia-indexd:9982}
      - SIA_ADMIN_URL=${SIA_ADMIN_URL:-http://sia-indexd:9980}
      - SIA_ADMIN_PASSWORD=${SIA_ADMIN_PASSWORD}
      - SIA_APP_ID=${SIA_APP_ID}
      - SIA_APP_KEY=${SIA_APP_KEY}
      - SIA_DATA_SHARDS=${SIA_DATA_SHARDS:-2}
      - SIA_PARITY_SHARDS=${SIA_PARITY_SHARDS:-4}
      - SIA_NETWORK=${SIA_NETWORK:-zen}
      # backend/src/config/env.ts refuses to boot when SESSION_SECRET is still
      # the development default and NODE_ENV=production, so this flag is what
      # arms that check. It also switches the logger to JSON and stops error
      # responses from leaking stack details.
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - UPLOAD_DIR=/app/uploads
      - TRANSCODE_OUTPUT_DIR=/app/transcode-output
      - CACHE_DIR=/app/cache
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-10737418240}
      - API_RATE_LIMIT_PER_MIN=${API_RATE_LIMIT_PER_MIN:-100}
      # Auth. SESSION_SECRET signs session cookies. If it is not passed in,
      # the container falls back to the publicly known dev default in
      # backend/src/config/env.ts and every session cookie becomes forgeable
      # (with NODE_ENV=production above, that case now refuses to boot).
      # Set a real value in the deploy environment or .env.
      - PUBLIC_URL=${PUBLIC_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_ALLOWED_USERS=${GITHUB_ALLOWED_USERS:-}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-${PUBLIC_URL}}
      - BOOTSTRAP_API_KEY=${BOOTSTRAP_API_KEY:-}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
    volumes:
      - uploads:/app/uploads
      - transcode-output:/app/transcode-output
      - cache:/app/cache
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sluby-postgres
    environment:
      POSTGRES_USER: sluby
      POSTGRES_PASSWORD: sluby
      POSTGRES_DB: sluby
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port exposure. Only accessible within the Docker network.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sluby -d sluby']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sluby-redis
    volumes:
      - redis-data:/data
    # No host port exposure. Only accessible within the Docker network.
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads:
  transcode-output:
  cache:
  pgdata:
  redis-data:
