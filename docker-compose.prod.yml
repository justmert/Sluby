services:
  backend:
    build: ./backend
    container_name: siastream-backend
    ports:
      - "4500:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://siastream:siastream@postgres:5432/siastream
      - REDIS_URL=redis://redis:6379
      - SIA_INDEXER_URL=${SIA_INDEXER_URL:-http://localhost:9980}
      - SIA_APP_ID=${SIA_APP_ID}
      - SIA_APP_KEY=${SIA_APP_KEY}
      - PORT=3000
      - HOST=0.0.0.0
      - UPLOAD_DIR=/app/uploads
      - TRANSCODE_OUTPUT_DIR=/app/transcode-output
      - CACHE_DIR=/app/cache
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-10737418240}
      - API_RATE_LIMIT_PER_MIN=${API_RATE_LIMIT_PER_MIN:-100}
    volumes:
      - uploads:/app/uploads
      - transcode-output:/app/transcode-output
      - cache:/app/cache
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: siastream-postgres
    environment:
      POSTGRES_USER: siastream
      POSTGRES_PASSWORD: siastream
      POSTGRES_DB: siastream
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port exposure — only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siastream -d siastream"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: siastream-redis
    volumes:
      - redis-data:/data
    # No host port exposure — only accessible within Docker network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads:
  transcode-output:
  cache:
  pgdata:
  redis-data:
