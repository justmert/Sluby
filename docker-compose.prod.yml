# production override: tls with caddy, secrets required, nothing but 80/443
# published, github sign-in instead of the local dev user.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# needs in .env: DOMAIN, ACME_EMAIL, POSTGRES_PASSWORD, SESSION_SECRET,
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, GITHUB_ALLOWED_USERS, SIA_APP_ID,
# SIA_APP_KEY.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: !reset []

  redis:
    ports: !reset []

  backend:
    environment:
      DATABASE_URL: postgresql://sluby:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/sluby
      NODE_ENV: production
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      # only the studio's own origin rides the session cookie across origins;
      # other origins can still call the api with a key
      CORS_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      AUTH_DISABLED: 'false'
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID in .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET in .env}
      # who may sign in. every account uploads to this deployment's sia
      # account, so open sign-up is a choice: set it to * to make it
      GITHUB_ALLOWED_USERS: ${GITHUB_ALLOWED_USERS:?set GITHUB_ALLOWED_USERS in .env (github logins, id:<number> entries, or * for open sign-up)}
      SIA_APP_ID: ${SIA_APP_ID:?run the indexer connect step and set SIA_APP_ID}
      SIA_APP_KEY: ${SIA_APP_KEY:?run the indexer connect step and set SIA_APP_KEY}

  web:
    # only caddy talks to it
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
