# sluby on one machine: postgres, redis, the backend and the web front door
# (the studio plus a caching proxy for api and delivery). everything is bound
# to localhost, which is what the quickstart uses.
#
#   cp .env.example .env
#   docker compose run --rm --no-deps backend node scripts/connect-indexer.mjs   # once, prints SIA_APP_* for you to paste
#   docker compose up -d
#   open http://localhost:8080
#
# for a public server with tls, layer the production override on top:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# to run the backend from source against these databases, publish their ports:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis

# docker's json-file logs grow without bound unless capped
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sluby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sluby}
      POSTGRES_DB: sluby
    volumes:
      # postgres 18 keeps its data under a versioned dir inside this path
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sluby -d sluby']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # bullmq needs keys to never be evicted, and the queue should survive a restart
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SIA_STORAGE_NATIVE: ${SIA_STORAGE_NATIVE:-}
    image: sluby-backend
    # tini as pid 1 reaps ffmpeg children and passes signals on to node.
    # the backend gives running work 25 s to finish on SIGTERM, then exits;
    # docker waits this long before it kills
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sluby:${POSTGRES_PASSWORD:-sluby}@postgres:5432/sluby
      REDIS_URL: redis://redis:6379
      # development keeps the quickstart's AUTH_DISABLED allowed and logs
      # readable; it no longer exposes stacks or a fixed session secret
      NODE_ENV: ${NODE_ENV:-development}
      EXPOSE_ERROR_STACKS: ${EXPOSE_ERROR_STACKS:-}
      PORT: '3000'
      HOST: 0.0.0.0
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      UPLOAD_DIR: /app/uploads
      TRANSCODE_OUTPUT_DIR: /app/transcode-output
      LOG_LEVEL: ${LOG_LEVEL:-}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-}
      CACHE_MAX_SIZE_MB: ${CACHE_MAX_SIZE_MB:-}
      TRANSCODE_MAX_RENDITION: ${TRANSCODE_MAX_RENDITION:-}
      # sia indexer. defaults to the hosted mainnet indexer; see the
      # production guide for a self-hosted indexd on the zen testnet.
      SIA_INDEXER_URL: ${SIA_INDEXER_URL:-https://sia.storage}
      SIA_NETWORK: ${SIA_NETWORK:-mainnet}
      SIA_APP_ID: ${SIA_APP_ID:-}
      SIA_APP_KEY: ${SIA_APP_KEY:-}
      # only for a self-hosted indexd: the admin api adds contract ids and the
      # wallet address to the storage breakdown
      SIA_ADMIN_URL: ${SIA_ADMIN_URL:-}
      SIA_ADMIN_PASSWORD: ${SIA_ADMIN_PASSWORD:-}
      # unset means the sdk default of 10 data + 20 parity shards
      SIA_DATA_SHARDS: ${SIA_DATA_SHARDS:-}
      SIA_PARITY_SHARDS: ${SIA_PARITY_SHARDS:-}
      # studio sign-in. AUTH_DISABLED signs everyone in as a local dev user;
      # the backend then gives other origins no cors and refuses their writes,
      # so other web pages cannot use it. production refuses to start with it.
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # optional github sign-in for members and invited people
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # settings of older versions, read once on the first start after the
      # upgrade to members and roles, then ignored with a warning
      GITHUB_ALLOWED_USERS: ${GITHUB_ALLOWED_USERS:-}
      OPERATOR_USERS: ${OPERATOR_USERS:-}
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-}
      # private networks webhook receivers may be on; empty means public only
      WEBHOOK_ALLOWED_NETWORKS: ${WEBHOOK_ALLOWED_NETWORKS:-}
      # browser origins, client address and limits; empty takes the backend's
      # defaults (configuration guide)
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      API_IP_RATE_LIMIT: ${API_IP_RATE_LIMIT:-}
      API_KEY_RATE_LIMIT_MAX: ${API_KEY_RATE_LIMIT_MAX:-}
      API_KEYS_PER_ACCOUNT_MAX: ${API_KEYS_PER_ACCOUNT_MAX:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      RECONCILE_ENABLED: ${RECONCILE_ENABLED:-}
      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-}
      RECONCILE_PAGE_SIZE: ${RECONCILE_PAGE_SIZE:-}
      DELETION_GC_ENABLED: ${DELETION_GC_ENABLED:-}
      DELETION_GC_INTERVAL_MS: ${DELETION_GC_INTERVAL_MS:-}
      DELETION_STUCK_THRESHOLD_MS: ${DELETION_STUCK_THRESHOLD_MS:-}
    volumes:
      - uploads:/app/uploads
      - transcode-output:/app/transcode-output
    logging: *logging
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SLUBY_SIA_INDEXER_URL: ${VITE_SLUBY_SIA_INDEXER_URL:-}
        VITE_SLUBY_SIA_APP_ID: ${VITE_SLUBY_SIA_APP_ID:-}
        VITE_SLUBY_SIA_APP_KEY: ${VITE_SLUBY_SIA_APP_KEY:-}
        VITE_SIA_EXPLORER_URL: ${VITE_SIA_EXPLORER_URL:-}
    image: sluby-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    environment:
      # per-client limits on delivery and sign-in; empty takes the defaults
      # in nginx/limits.envsh
      WEB_DELIVERY_RATE: ${WEB_DELIVERY_RATE:-}
      WEB_DELIVERY_BURST: ${WEB_DELIVERY_BURST:-}
      WEB_DELIVERY_CONN: ${WEB_DELIVERY_CONN:-}
      WEB_AUTH_RATE: ${WEB_AUTH_RATE:-}
      WEB_AUTH_BURST: ${WEB_AUTH_BURST:-}
      WEB_AUTH_CONN: ${WEB_AUTH_CONN:-}
    volumes:
      - nginx-cache:/var/cache/nginx/sia
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
  uploads:
  transcode-output:
  nginx-cache:
