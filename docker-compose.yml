services:
  backend:
    build: ./backend
    container_name: sluby-backend
    ports:
      - '4500:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://sluby:sluby@postgres:5432/sluby
      - REDIS_URL=redis://redis:6379
      # indexd is brought up by docker-compose.sia.yml. Both files live in the
      # same directory, so both compose projects share the same default
      # network and the container hostname `sia-indexd` resolves from here.
      # 9982 is the application API the backend SDK talks to. 9980 is the
      # password-protected admin API (wallet address, contract list).
      # `localhost` would resolve to the backend container itself, not indexd.
      - SIA_INDEXER_URL=${SIA_INDEXER_URL:-http://sia-indexd:9982}
      - SIA_ADMIN_URL=${SIA_ADMIN_URL:-http://sia-indexd:9980}
      - SIA_ADMIN_PASSWORD=${SIA_ADMIN_PASSWORD}
      - SIA_APP_ID=${SIA_APP_ID}
      - SIA_APP_KEY=${SIA_APP_KEY}
      - SIA_DATA_SHARDS=${SIA_DATA_SHARDS:-2}
      - SIA_PARITY_SHARDS=${SIA_PARITY_SHARDS:-4}
      - SIA_NETWORK=${SIA_NETWORK:-zen}
      - PORT=3000
      - HOST=0.0.0.0
      - UPLOAD_DIR=/app/uploads
      - TRANSCODE_OUTPUT_DIR=/app/transcode-output
      - CACHE_DIR=/app/cache
      # Auth. SESSION_SECRET signs session cookies, so it must come from the
      # environment rather than falling back to the dev default baked into
      # backend/src/config/env.ts. `cp .env.example .env` populates it.
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:4500}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_ALLOWED_USERS=${GITHUB_ALLOWED_USERS:-}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - BOOTSTRAP_API_KEY=${BOOTSTRAP_API_KEY:-}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
    volumes:
      - uploads:/app/uploads
      - transcode-output:/app/transcode-output
      - cache:/app/cache
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: sluby-nginx
    ports:
      - '80:80'
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-cache:/var/cache/nginx/sia
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sluby-postgres
    environment:
      POSTGRES_USER: sluby
      POSTGRES_PASSWORD: sluby
      POSTGRES_DB: sluby
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sluby -d sluby']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sluby-redis
    volumes:
      - redis-data:/data
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads:
  transcode-output:
  cache:
  nginx-cache:
  pgdata:
  redis-data:
