name: Release

# publishes one package when its tag is pushed: sdk-v0.2.0 publishes @sluby/sdk
# 0.2.0, player-v0.2.0 publishes @sluby/player 0.2.0. npm authenticates this
# workflow through trusted publishing (oidc), so there is no npm token secret,
# and it attaches a provenance attestation to each release on its own.

on:
  push:
    tags:
      - 'sdk-v*'
      - 'player-v*'

permissions:
  contents: read

# one publish per tag at a time; a second push of the same tag waits
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the npm environment is protected: a maintainer approves each publish in
    # the repository settings' environment rules, and npm's trusted publisher
    # for both packages names this workflow and this environment, so no other
    # job can mint a publishing token
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history and main, to check that the tag is on main
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # no dependency cache in a publishing job, so a poisoned cache
          # cannot end up in a release
          package-manager-cache: false

      # refuses anything but a well-formed tag on a commit of main whose
      # version matches the package
      - name: Check the tag
        id: pkg
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: scripts/release-check.sh >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test --workspace=${{ steps.pkg.outputs.name }}

      - name: Check the packed tarballs
        run: npm run check:packages

      # prepack builds the package and copies LICENSE and NOTICE into it.
      # trusted publishing attaches the provenance attestation; --provenance
      # makes a missing one an error instead of a silent omission
      - name: Publish
        run: >-
          npm publish --workspace=${{ steps.pkg.outputs.name }}
          --provenance --tag ${{ steps.pkg.outputs.dist_tag }}
