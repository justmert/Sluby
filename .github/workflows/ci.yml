name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# the jobs only read the repository
permissions:
  contents: read

# a new push to a pull request replaces its running checks; main keeps every run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # what the images and the published packages run must have no known
      # advisory. the dev tree is checked by dependabot instead: its current
      # advisories (shadcn, drizzle-kit, scalar) have no fixed release yet
      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      # optional platform builds bundle their own dependencies, which npm ls
      # reports as missing, so the tree check leaves optional ones out
      - name: Check the dependency tree
        run: npm ls --omit=optional

  # the backend has its own job: its tests need postgres, redis and the
  # ffmpeg binaries, and they refuse to skip under CI when any is missing
  backend:
    name: 'backend - Typecheck & Test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: sluby-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # each test file creates, migrates and drops its own database on this server
      SLUBY_TEST_DATABASE_URL: postgres://postgres:sluby-test@localhost:5432/postgres
      # queue tests use a random key prefix each and clean up after themselves
      SLUBY_TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --project backend/tsconfig.json

      # runs the whole suite once, with v8 coverage; the per-file table and
      # the totals are printed to this log
      - name: Test with coverage
        run: npm run test:coverage --workspace=backend

  typecheck-and-test:
    name: '${{ matrix.package }} - Typecheck & Test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: sdk
            workspace: '@sluby/sdk'
            path: packages/sdk
            script: test:coverage
          - package: player
            workspace: '@sluby/player'
            path: packages/player
            script: test:coverage
          - package: studio
            workspace: sluby-frontend
            path: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # A single root `npm ci` installs every workspace's dependencies
      # (including typescript and vitest) hoisted into the root node_modules.
      # A second `npm ci --workspace=<pkg>` used to run here, but it pruned the
      # hoisted `tsc`, so `npx tsc` fetched an unrelated `tsc` package and every
      # typecheck job failed before the tests could run.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --project ${{ matrix.path }}/tsconfig.json

      # sdk and player run under coverage, which prints the summary to the log
      - name: Test
        run: npm run ${{ matrix.script || 'test' }} --workspace=${{ matrix.workspace }} --if-present

  player-browser:
    name: Browser tests (chromium, firefox, webkit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # real hls.js playback in each browser against a checked-in hls fixture
      - name: Player browser tests
        run: npm run test:browser --workspace=@sluby/player

      # sdk uploads through the browser build of tus-js-client and its localStorage
      - name: SDK browser tests
        run: npm run test:browser --workspace=@sluby/sdk

      # studio parts that only show in a real browser, such as the sign-in
      # screen appearing while motion's features are still loading
      - name: Studio browser tests
        run: npm run test:browser --workspace=sluby-frontend

  studio-build:
    name: Studio builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # the studio builds the sdk and player from source (vite alias), so it
      # needs no package prebuild
      - name: Build studio
        run: npm run build --workspace=sluby-frontend

  example-build:
    name: Quickstart example builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The examples consume the built packages, so build them first.
      - name: Build SDK and player
        run: |
          npm run build:sdk
          npm run build:player

      # each build typechecks first (tsc -b for the react app, checkJs over the
      # browser and node scripts for the plain javascript one)
      - name: Build React example
        run: npm run build --workspace=@sluby/example-quickstart

      - name: Build plain JavaScript example
        run: npm run build --workspace=@sluby/example-vanilla

  docs-build:
    name: Docs site builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # the docs site has its own lockfile so its next.js and fumadocs stay
      # out of the app workspaces. the build also checks every internal link.
      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Build docs
        run: npm run docs:build

  landing-build:
    name: Landing page builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json

      # like the docs, the landing page has its own lockfile and stays out of
      # the app workspaces. the build type-checks it first.
      - name: Install landing page dependencies
        run: npm ci --prefix landing

      - name: Build landing page
        run: npm run landing:build

  packages:
    name: Packages pack cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # packs @sluby/sdk and @sluby/player like npm publish does and runs attw
      # and publint on the tarballs
      - name: Check packages
        run: npm run check:packages

  # the deliverable is "clone, docker compose up": build both images, start
  # the stack the quickstart starts, check the front door and that the backend
  # stops cleanly on SIGTERM
  stack:
    name: Compose stack builds, starts and stops
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure like the quickstart
        run: |
          cp .env.example .env
          key="sluby_$(openssl rand -hex 32)"
          echo "BOOTSTRAP_API_KEY=$key" >> .env
          echo "::add-mask::$key"

      - name: Build the images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Check the stack
        run: |
          set -a; . ./.env; set +a
          scripts/stack-check.sh

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Remove the stack
        if: always()
        run: docker compose down -v
