#
# Server compose file for the Sluby deployment at sluby.app.
#
# Architecture:
#   - sia-indexd (sluby/indexd:patched, see docker-compose.sia.yml):
#       runs in its own compose project. Manages contracts, accounts,
#       and slabs across Zen-testnet hosts. Backend talks to it via
#       the indexd application API on port 9982 and the admin API on
#       port 9980. Both are bound to 127.0.0.1 only.
#   - sluby-backend  : Node.js service. Loads sia-storage NAPI,
#                          signs requests with a stored AppKey, and
#                          uploads/downloads through indexd. Bound to
#                          127.0.0.1:4600 on the host so the system
#                          nginx can proxy.
#   - sluby-postgres : metadata store.
#   - sluby-redis    : BullMQ + rate limiter backing store.
#
# The backend container uses host networking to reach indexd on the
# host's loopback interface (where docker-compose.sia.yml publishes
# its ports). Postgres and Redis stay on this compose project's own
# network, so their hostnames resolve via the Docker network.
#
services:
  backend:
    build: ./backend
    image: sluby-backend:latest
    container_name: sluby-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://sluby:sluby@postgres:5432/sluby
      - REDIS_URL=redis://redis:6379
      # indexd runs in the same compose project's default network
      # (docker-compose.sia.yml lives under the same /home/admin/sluby
      # directory, so both projects share `sluby_default`). Container
      # hostname `sia-indexd` resolves on that network.
      - SIA_INDEXER_URL=${SIA_INDEXER_URL:-http://sia-indexd:9982}
      - SIA_ADMIN_URL=${SIA_ADMIN_URL:-http://sia-indexd:9980}
      - SIA_ADMIN_PASSWORD=${SIA_ADMIN_PASSWORD}
      - SIA_APP_ID=${SIA_APP_ID}
      - SIA_APP_KEY=${SIA_APP_KEY}
      - SIA_DATA_SHARDS=${SIA_DATA_SHARDS:-2}
      - SIA_PARITY_SHARDS=${SIA_PARITY_SHARDS:-4}
      - SIA_NETWORK=${SIA_NETWORK:-zen}
      # backend/src/config/env.ts refuses to boot when SESSION_SECRET is still
      # the development default and NODE_ENV=production, so this flag is what
      # arms that check. It also switches the logger to JSON and stops error
      # responses from leaking stack details.
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - UPLOAD_DIR=/app/uploads
      - TRANSCODE_OUTPUT_DIR=/app/transcode-output
      - CACHE_DIR=/app/cache
      - PUBLIC_URL=${PUBLIC_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_ALLOWED_USERS=${GITHUB_ALLOWED_USERS:-}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGIN=${PUBLIC_URL}
      - BOOTSTRAP_API_KEY=${BOOTSTRAP_API_KEY:-}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
    ports:
      - '127.0.0.1:4600:3000'
    volumes:
      - uploads:/app/uploads
      - transcode-output:/app/transcode-output
      - cache:/app/cache
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sluby-postgres
    environment:
      POSTGRES_USER: sluby
      POSTGRES_PASSWORD: sluby
      POSTGRES_DB: sluby
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sluby -d sluby']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sluby-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads:
  transcode-output:
  cache:
  pgdata:
  redis-data:
