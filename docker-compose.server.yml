# compose file for a server that already runs its own reverse proxy (nginx on
# the host terminating tls) and a self-hosted indexd from docker-compose.sia.yml
# on the zen testnet. the backend listens on 127.0.0.1:4600 for that proxy.
#
# the zen pool is small, so this setup pins 2 data + 4 parity shards and builds
# with a custom sia-storage binary from backend/vendor/ (see
# backend/vendor/README.md). for a fresh deployment use docker-compose.yml with
# docker-compose.prod.yml instead.
#
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SIA_STORAGE_NATIVE: ${SIA_STORAGE_NATIVE:-sia-storage-linux-x64-gnu/sia-storage.node}
    image: sluby-backend:latest
    container_name: sluby-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://sluby:sluby@postgres:5432/sluby
      - REDIS_URL=redis://redis:6379
      # indexd runs in the same compose project's default network
      # (docker-compose.sia.yml lives under the same /home/admin/sluby
      # directory, so both projects share `sluby_default`). Container
      # hostname `sia-indexd` resolves on that network.
      - SIA_INDEXER_URL=${SIA_INDEXER_URL:-http://sia-indexd:9982}
      - SIA_ADMIN_URL=${SIA_ADMIN_URL:-http://sia-indexd:9980}
      - SIA_ADMIN_PASSWORD=${SIA_ADMIN_PASSWORD}
      - SIA_APP_ID=${SIA_APP_ID}
      - SIA_APP_KEY=${SIA_APP_KEY}
      - SIA_DATA_SHARDS=${SIA_DATA_SHARDS:-2}
      - SIA_PARITY_SHARDS=${SIA_PARITY_SHARDS:-4}
      - SIA_NETWORK=${SIA_NETWORK:-zen}
      # backend/src/config/env.ts refuses to boot when SESSION_SECRET is still
      # the development default and NODE_ENV=production, so this flag is what
      # arms that check. It also switches the logger to JSON and stops error
      # responses from leaking stack details.
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - UPLOAD_DIR=/app/uploads
      - TRANSCODE_OUTPUT_DIR=/app/transcode-output
      - CACHE_DIR=/app/cache
      - PUBLIC_URL=${PUBLIC_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_ALLOWED_USERS=${GITHUB_ALLOWED_USERS:-}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGIN=${PUBLIC_URL}
      - BOOTSTRAP_API_KEY=${BOOTSTRAP_API_KEY:-}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
    ports:
      - '127.0.0.1:4600:3000'
    volumes:
      - uploads:/app/uploads
      - transcode-output:/app/transcode-output
      - cache:/app/cache
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sluby-postgres
    environment:
      POSTGRES_USER: sluby
      POSTGRES_PASSWORD: sluby
      POSTGRES_DB: sluby
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sluby -d sluby']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sluby-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads:
  transcode-output:
  cache:
  pgdata:
  redis-data:
